# antivirusb - politique USBGuard pour les périphériques branchés APRÈS le démarrage.
# (Ceux présents au démarrage, clavier/souris et clé de démarrage, sont autorisés :
#  PresentDevicePolicy=allow.) La première règle qui correspond s'applique ;
# tout périphérique qui ne correspond à aucune règle est bloqué.

# 1. Tout périphérique comportant une interface clavier/souris (HID) est bloqué :
#    protection contre les clés « BadUSB » qui tapent des commandes.
block with-interface one-of { 03:*:* }

# 2. Supports de stockage purs (clés, disques, lecteurs de cartes)
allow with-interface match-all { 08:*:* }

# 3. Concentrateurs USB
allow with-interface match-all { 09:*:* }

# 4. Smartphones en partage de connexion USB
#    (Android RNDIS / CDC-ECM / CDC-NCM, iPhone)
allow with-interface one-of { 02:*:* e0:01:03 ef:04:01 ff:fd:01 }
